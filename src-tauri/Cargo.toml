[package]
name = "mdexport"
version = "0.2.0"
description = "Local-first Markdown workspace for developers"
authors = ["MDExport"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdexport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = { version = "0.55.0", default-features = false, features = ["syntect-fancy"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
trash = "5.2.9"
sha2 = "0.11.0"
thiserror = "2.0.21"
docx-rs = "0.4.22"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
tauri-plugin-updater = "2"


# Dev builds: keep line-level debug info for MDExport itself, none for dependencies.
# Full debug info for Typst, docx-rs & co. made `target/` grow past 20 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
